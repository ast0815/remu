[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "remu"
description = "Response Matrix Utilities for likelihood calculations and hypothesis testing"
authors = [{name = "Lukas Koch", email = "lukas.koch@mailbox.org"}]
readme = "README.rst"
license = {file = "LICENSE"}
classifiers=[
    # See: https://pypi.org/pypi?%3Aaction=list_classifiers
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 4 - Beta",
    # Indicate who your project is intended for
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    # Pick your license as you wish (should match "license" above)
    "License :: OSI Approved :: MIT License",
    # Specify the Python versions you support here. In particular, ensure
    # that you indicate whether you support Python 2, Python 3 or both.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dynamic = ["version"]
requires-python = ">=3.8,<4"
dependencies = [
    "numpy >= 1.21.0, < 3.0.0",
    "scipy >= 1.7.0, < 2.0.0",
    "pyyaml >= 5.4",
    "matplotlib >= 3.5.0",
]

[project.optional-dependencies]
mcmc = [
    "emcee >= 3.1.0",
]
test = [
    "coverage >= 6.5",
    "coveralls >= 3.3",
    "pandas >= 1.3",
    "pytest >= 7.0",
    "pytest-cov >= 4.0",
]
docs = [
    "numpydoc == 1.1.0",
    "Sphinx == 6.2.1",
    "sphinx-autobuild == 2021.3.14",
    "sphinx-rtd-theme == 3.1.0",
    "sphinxcontrib-svg2pdfconverter == 2.0.0",
    "sphinxcontrib-websupport == 1.2.4",
]
examples = [
    "awkward-pandas",
    "multiprocess >= 0.70",
    "uproot >= 5.0",
]

[project.urls]
Home = "https://remu.readthedocs.io/en/latest/"

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/remu/_version.py"

# The example data files under docs/examples are tracked in git for the
# repository, but they only weigh the sdist down (~47 MB) - they are not
# needed to build the package.
[tool.hatch.build.targets.sdist]
exclude = [
    "docs/examples/**/*.txt",
    "docs/examples/**/*.npz",
    "docs/examples/**/*.root",
]

# Tools that are needed outside the nox session environments (uv installs
# this group by default with `uv sync`).
[dependency-groups]
dev = [
    "nox >= 2024.3.2",
    "pre-commit >= 3.5",
]

# Third-party libraries that do not ship type information.
[[tool.mypy.overrides]]
module = ["emcee", "emcee.*", "scipy", "scipy.*"]
ignore_missing_imports = true
